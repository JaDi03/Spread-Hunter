[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.30"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = [
    "forge-std/=lib/forge-std/src/",
    "@reactive/=lib/reactive-lib-omni/",
]

[fmt]
line_length = 120

[rpc_endpoints]
lasna = "${LASNA_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
unichain_sepolia = "${UNICHAIN_SEPOLIA_RPC_URL}"
